[project]
name = "ml-100-days"
version = "0.1.0"
description = "Participating in 100 days of doing Machine Learning Projects"
readme = "README.md"
authors = [
    { name = "Kubania", email = "mercykubz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml-100-days = "ml_100_days:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
